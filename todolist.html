<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>귀살대 임무 일지 | 鬼殺隊 任務日誌</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 구글 폰트 (동양풍 명조체 및 가독성 폰트) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&family=Yuji+Boku&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serifKr: ['"Noto Serif KR"', 'serif'],
            calli: ['"Yuji Boku"', '"Noto Serif KR"', 'serif'],
          },
          colors: {
            slayer: {
              black: '#101314',
              dark: '#181d20',
              paper: '#f5eee6',
              paperDark: '#22282e',
              tanjiroGreen: '#0f6b4d',
              tanjiroBlack: '#141c19',
              red: '#b91c1c',
              gold: '#eab308',
              wisteria: '#8b5cf6',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* 귀멸의 칼날 탄지로 이치마츠(바둑판) 격자 배경 패턴 */
    .ichimatsu-pattern {
      background-size: 32px 32px;
      background-image: 
        linear-gradient(45deg, #0e5c41 25%, transparent 25%), 
        linear-gradient(-45deg, #0e5c41 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #0e5c41 75%), 
        linear-gradient(-45deg, transparent 75%, #0e5c41 75%);
      background-color: #121816;
    }

    /* 젠이츠 테마 패턴 */
    .zenitsu-pattern {
      background-size: 30px 30px;
      background-image: 
        linear-gradient(135deg, #f59e0b 25%, transparent 25%), 
        linear-gradient(225deg, #f59e0b 25%, transparent 25%), 
        linear-gradient(45deg, #fbbf24 25%, transparent 25%), 
        linear-gradient(315deg, #fbbf24 25%, #d97706 25%);
      background-color: #78350f;
    }

    /* 렌고쿠 테마 그라디언트 */
    .rengoku-pattern {
      background: linear-gradient(135deg, #7f1d1d 0%, #b91c1c 40%, #ea580c 70%, #facc15 100%);
    }

    /* 기유 테마 패턴 (반반 하오리 느낌) */
    .giyu-pattern {
      background: linear-gradient(90deg, #5b1420 50%, #155e75 50%);
    }

    /* 전통 두루마리 테두리 */
    .scroll-border {
      border: 2px solid #846341;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.6);
    }

    /* 붓글씨 느낌 그림자 */
    .ink-shadow {
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8), 0 0 10px rgba(220, 38, 38, 0.5);
    }

    /* 일륜도 베기 애니메이션 */
    @keyframes swordSlash {
      0% {
        transform: scaleX(0);
        opacity: 0;
      }
      50% {
        opacity: 1;
      }
      100% {
        transform: scaleX(1);
        opacity: 0.85;
      }
    }

    .slash-effect {
      position: relative;
    }
    .slash-effect::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #38bdf8, #ef4444, #f59e0b, transparent);
      box-shadow: 0 0 8px #ef4444;
      transform-origin: left;
      animation: swordSlash 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* 드래그 상태 */
    .dragging {
      opacity: 0.4;
      border: 2px dashed #eab308 !important;
      transform: scale(0.98);
    }

    .drag-over {
      border-top: 3px solid #38bdf8 !important;
    }

    /* 스크롤바 커스텀 */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #111417;
    }
    ::-webkit-scrollbar-thumb {
      background: #3f474f;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #713f12;
    }
  </style>
</head>
<body class="bg-stone-950 text-stone-200 font-serifKr min-h-screen relative overflow-x-hidden selection:bg-red-800 selection:text-white">

  <!-- 등꽃 꽃잎(Wisteria Petals) & 불꽃 캔버스 배경 -->
  <canvas id="petalCanvas" class="fixed inset-0 pointer-events-none z-0"></canvas>

  <div class="relative z-10 max-w-3xl mx-auto px-4 py-8 md:py-12 flex flex-col min-h-screen">
    
    <!-- 상단 헤더 & 컨트롤 영역 -->
    <header class="mb-6 text-center relative">
      <!-- 상단 리본 패턴 -->
      <div id="themeBanner" class="ichimatsu-pattern h-5 w-full rounded-t-lg shadow-md transition-all duration-500"></div>

      <div class="bg-stone-900/90 border-x-2 border-b-2 border-amber-900/60 rounded-b-xl p-6 backdrop-blur-sm shadow-2xl relative">
        <!-- 오디오 효과음 토글 & 테마 셀렉터 버튼 -->
        <div class="flex flex-wrap items-center justify-between gap-3 mb-4 pb-3 border-b border-stone-800 text-xs">
          <!-- 사운드 토글 -->
          <button id="soundToggleBtn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-stone-800 hover:bg-stone-700 text-stone-300 transition-colors border border-stone-700 cursor-pointer">
            <svg id="soundIconOn" class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
            <svg id="soundIconOff" class="w-4 h-4 text-stone-500 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/></svg>
            <span id="soundStatusText">일륜도 검명음 ON</span>
          </button>

          <!-- 테마 선택 -->
          <div class="flex items-center gap-1.5">
            <span class="text-stone-400 text-xs hidden sm:inline">호흡 테마:</span>
            <div class="flex items-center gap-1 bg-stone-950 p-1 rounded-lg border border-stone-800">
              <button onclick="changeTheme('tanjiro')" title="물의 호흡 / 탄지로" class="w-6 h-6 rounded bg-emerald-800 border border-emerald-400 hover:scale-110 transition-transform text-[10px] font-bold cursor-pointer">炭</button>
              <button onclick="changeTheme('zenitsu')" title="번개의 호흡 / 젠이츠" class="w-6 h-6 rounded bg-amber-600 border border-amber-300 hover:scale-110 transition-transform text-[10px] font-bold cursor-pointer">善</button>
              <button onclick="changeTheme('rengoku')" title="화염의 호흡 / 렌고쿠" class="w-6 h-6 rounded bg-red-700 border border-yellow-400 hover:scale-110 transition-transform text-[10px] font-bold cursor-pointer">煉</button>
              <button onclick="changeTheme('giyu')" title="잔잔한 물결 / 기유" class="w-6 h-6 rounded bg-cyan-800 border border-cyan-400 hover:scale-110 transition-transform text-[10px] font-bold cursor-pointer">義</button>
            </div>
          </div>
        </div>

        <!-- 타이틀 헤더 -->
        <div class="flex items-center justify-center gap-3">
          <div class="w-8 h-8 rounded-full bg-red-900 border-2 border-red-500 flex items-center justify-center shadow-lg shadow-red-900/50">
            <span class="font-calli text-white text-base">滅</span>
          </div>
          <h1 class="text-2xl md:text-3xl font-black tracking-widest text-stone-100 ink-shadow">
            鬼殺隊 任務日誌
          </h1>
          <div class="w-8 h-8 rounded-full bg-red-900 border-2 border-red-500 flex items-center justify-center shadow-lg shadow-red-900/50">
            <span class="font-calli text-white text-base">殺</span>
          </div>
        </div>
        <p class="text-stone-400 text-xs md:text-sm mt-1 tracking-wider">
          귀살대원 임무 관리 두루마리 · "마음을 불태워라, 전집중의 호흡으로 완수하라"
        </p>

        <!-- 귀살대 계급 게이지 (Mizunoto to Hashira) -->
        <div class="mt-5 bg-stone-950/80 p-3.5 rounded-lg border border-stone-800 flex flex-col sm:flex-row items-center justify-between gap-3">
          <div class="flex items-center gap-3 w-full sm:w-auto">
            <div id="rankBadge" class="px-3 py-1 rounded bg-amber-950/80 border border-amber-600 text-amber-300 font-bold text-sm tracking-widest flex items-center gap-1 shadow">
              <span class="text-xs text-amber-500">계급:</span>
              <span id="rankTitle">癸 (계 - 미즈노토)</span>
            </div>
            <div class="text-left text-xs text-stone-400">
              <span id="taskStats">토벌 완료: 0 / 총 0건</span>
            </div>
          </div>

          <!-- 진행률 바 -->
          <div class="w-full sm:w-60 bg-stone-900 h-3 rounded-full overflow-hidden border border-stone-800 relative">
            <div id="progressBar" class="bg-gradient-to-r from-emerald-600 via-amber-500 to-red-600 h-full w-0 transition-all duration-500"></div>
          </div>
        </div>
      </div>
    </header>

    <!-- 임무 추가 (입력창) -->
    <section class="mb-6">
      <div class="bg-stone-900/90 border border-amber-900/40 rounded-xl p-4 shadow-xl backdrop-blur-sm">
        <form id="todoForm" class="space-y-3">
          <div class="flex flex-col sm:flex-row gap-2">
            <div class="relative flex-grow">
              <input 
                type="text" 
                id="taskInput" 
                placeholder="하달받은 임무 내용을 입력하십시오..." 
                class="w-full bg-stone-950 border border-stone-700 rounded-lg px-4 py-3 text-stone-100 placeholder-stone-500 focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition-colors text-sm"
                autocomplete="off"
                required
              />
            </div>
            
            <!-- 임무 호흡/유형 선택 -->
            <select id="taskCategory" class="bg-stone-950 border border-stone-700 text-stone-300 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-amber-500 cursor-pointer">
              <option value="water">💧 물의 호흡 (일상/기초)</option>
              <option value="flame">🔥 화염의 호흡 (긴급/중요)</option>
              <option value="thunder">⚡ 번개의 호흡 (신속 처리)</option>
              <option value="beast">🐗 짐승의 호흡 (육체/운동)</option>
              <option value="flower">🌸 꽃의 호흡 (학습/자기계발)</option>
            </select>

            <!-- 임무 하달 버튼 -->
            <button 
              type="submit" 
              class="relative overflow-hidden group bg-gradient-to-r from-red-800 to-red-600 hover:from-red-700 hover:to-red-500 text-white font-bold px-5 py-3 rounded-lg text-sm transition-all duration-200 shadow-lg shadow-red-950 flex items-center justify-center gap-2 shrink-0 active:scale-95 cursor-pointer"
            >
              <svg class="w-4 h-4 transition-transform group-hover:rotate-45" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
              </svg>
              <span>임무 하달</span>
            </button>
          </div>
        </form>
      </div>
    </section>

    <!-- 필터 및 제어 바 -->
    <div class="flex flex-wrap items-center justify-between gap-2 mb-4 px-1 text-xs">
      <!-- 탭 버튼들 -->
      <div class="flex items-center gap-1 bg-stone-900 p-1 rounded-lg border border-stone-800">
        <button onclick="setFilter('all')" id="filterAll" class="px-3 py-1.5 rounded-md font-medium transition-colors bg-stone-800 text-amber-400 cursor-pointer">전체 임무</button>
        <button onclick="setFilter('active')" id="filterActive" class="px-3 py-1.5 rounded-md font-medium text-stone-400 hover:text-stone-200 transition-colors cursor-pointer">수행 중</button>
        <button onclick="setFilter('completed')" id="filterCompleted" class="px-3 py-1.5 rounded-md font-medium text-stone-400 hover:text-stone-200 transition-colors cursor-pointer">토벌 완료</button>
      </div>

      <!-- 도움말 문구 및 일괄 삭제 -->
      <div class="flex items-center gap-2">
        <span class="text-stone-400 hidden md:inline">💡 항목을 드래그하거나 ▲▼ 버튼으로 순서를 바꿀 수 있습니다</span>
        <button onclick="clearCompletedTasks()" class="text-stone-400 hover:text-red-400 transition-colors px-2 py-1 rounded bg-stone-900 border border-stone-800 hover:border-red-900 cursor-pointer">
          완료 임무 정리
        </button>
      </div>
    </div>

    <!-- 할 일 목록 (Mission Scroll) -->
    <main class="flex-grow">
      <ul id="taskList" class="space-y-2.5">
        <!-- 동적으로 렌더링됩니다 -->
      </ul>

      <!-- 빈 목록 안내 화면 -->
      <div id="emptyState" class="hidden text-center py-16 px-4 bg-stone-900/40 rounded-xl border border-dashed border-stone-800">
        <div class="w-16 h-16 mx-auto mb-3 rounded-full bg-stone-900 flex items-center justify-center border border-stone-700">
          <svg class="w-8 h-8 text-amber-500/60" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        </div>
        <h3 class="text-stone-300 font-bold text-base mb-1">현재 부여된 임무가 없습니다</h3>
        <p class="text-stone-400 text-xs">새로운 임무를 등록하고 혈귀를 토벌하여 주(柱)의 자리에 도달하십시오.</p>
      </div>
    </main>

    <!-- 하단 푸터 -->
    <footer class="mt-12 text-center text-xs text-stone-400 pt-6 border-t border-stone-800/80">
      <p>귀살대 본부 (鬼殺隊本部) · 꺾이지 않는 칼날로 사명을 다하라</p>
    </footer>
  </div>

  <!-- 맞춤 알림 토스트 (alert 미사용 규정 준수) -->
  <div id="toast" class="fixed bottom-6 right-6 transform translate-y-24 opacity-0 transition-all duration-300 z-50 flex items-center gap-3 px-4 py-3 rounded-lg bg-stone-900 border border-amber-600 text-stone-100 shadow-2xl shadow-black">
    <div id="toastIcon" class="text-amber-400 text-base">⚔️</div>
    <span id="toastMsg" class="text-sm font-medium">알림 메시지</span>
  </div>

  <script>
    /* =========================================================
     * 1. 전역 상태 및 데이터 관리
     * ========================================================= */
    const STORAGE_KEY = 'kimetsu_tasks_data';
    const THEME_KEY = 'kimetsu_theme_key';
    const SOUND_KEY = 'kimetsu_sound_key';

    let currentFilter = 'all'; // 'all' | 'active' | 'completed'
    let soundEnabled = true;
    let currentTheme = 'tanjiro';
    let draggedItemIndex = null;

    // 귀살대 계급 목록 (Mizunoto to Hashira)
    const RANKS = [
      { min: 0, title: '癸 (계 - 미즈노토)', color: 'text-stone-400', badge: 'border-stone-600' },
      { min: 2, title: '壬 (임 - 미즈노에)', color: 'text-stone-300', badge: 'border-stone-500' },
      { min: 4, title: '辛 (신 - 카노토)', color: 'text-emerald-400', badge: 'border-emerald-600' },
      { min: 6, title: '庚 (경 - 카노에)', color: 'text-cyan-400', badge: 'border-cyan-600' },
      { min: 8, title: '己 (기 - 츠치노토)', color: 'text-blue-400', badge: 'border-blue-600' },
      { min: 10, title: '戊 (무 - 츠치노에)', color: 'text-indigo-400', badge: 'border-indigo-600' },
      { min: 13, title: '丁 (정 - 히노토)', color: 'text-purple-400', badge: 'border-purple-600' },
      { min: 16, title: '丙 (병 - 히노에)', color: 'text-pink-400', badge: 'border-pink-600' },
      { min: 20, title: '乙 (을 - 키노토)', color: 'text-amber-400', badge: 'border-amber-500' },
      { min: 25, title: '甲 (갑 - 키노에)', color: 'text-orange-400', badge: 'border-orange-500' },
      { min: 30, title: '柱 (주 - Hashira)', color: 'text-red-400', badge: 'border-red-500 shadow-red-900/60 shadow-lg' }
    ];

    // 카테고리 정보
    const CATEGORIES = {
      water: { label: '물의 호흡', icon: '💧', color: 'bg-cyan-950/70 text-cyan-300 border-cyan-800' },
      flame: { label: '화염의 호흡', icon: '🔥', color: 'bg-red-950/70 text-red-300 border-red-800' },
      thunder: { label: '번개의 호흡', icon: '⚡', color: 'bg-amber-950/70 text-amber-300 border-amber-800' },
      beast: { label: '짐승의 호흡', icon: '🐗', color: 'bg-emerald-950/70 text-emerald-300 border-emerald-800' },
      flower: { label: '꽃의 호흡', icon: '🌸', color: 'bg-purple-950/70 text-purple-300 border-purple-800' }
    };

    // 기본 초기 샘플 데이터
    const defaultTasks = [
      { id: 1710000001, text: '전집중 호흡 상중(常中) 유지 수련 30분', category: 'water', completed: true, createdAt: '자시(子時)' },
      { id: 1710000002, text: '아사쿠사에 출몰한 하현급 혈귀 기척 조사', category: 'flame', completed: false, createdAt: '축시(丑時)' },
      { id: 1710000003, text: '일륜도 손질 및 하가네즈카 씨에게 칼날 연마 부탁', category: 'thunder', completed: false, createdAt: '인시(寅時)' }
    ];

    let tasks = loadTasks();

    /* =========================================================
     * 2. 사운드 시스템 (Web Audio API - 외부 음원 의존 없음)
     * ========================================================= */
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
      },
      // 일륜도 베기 검격 효과음 (Slash)
      playSlash() {
        if (!soundEnabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          if (this.ctx.state === 'suspended') this.ctx.resume();
          const now = this.ctx.currentTime;
          
          const bufferSize = Math.floor(this.ctx.sampleRate * 0.15);
          const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const output = noiseBuffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            output[i] = Math.random() * 2 - 1;
          }

          const whiteNoise = this.ctx.createBufferSource();
          whiteNoise.buffer = noiseBuffer;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(3200, now);
          filter.frequency.exponentialRampToValueAtTime(800, now + 0.14);
          filter.Q.setValueAtTime(3.0, now);

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

          whiteNoise.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);

          const osc = this.ctx.createOscillator();
          const oscGain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(1200, now);
          osc.frequency.exponentialRampToValueAtTime(300, now + 0.12);

          oscGain.gain.setValueAtTime(0.2, now);
          oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

          osc.connect(oscGain);
          oscGain.connect(this.ctx.destination);

          whiteNoise.start(now);
          osc.start(now);
          osc.stop(now + 0.15);
        } catch (e) {
          console.error(e);
        }
      },
      // 칼을 칼집에 꽂는 소리 / 완료 해제음
      playSheathe() {
        if (!soundEnabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          if (this.ctx.state === 'suspended') this.ctx.resume();
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);

          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + 0.09);
        } catch (e) {}
      },
      // 임무 하달 추가음 (북소리 / 징소리 울림)
      playDrum() {
        if (!soundEnabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          if (this.ctx.state === 'suspended') this.ctx.resume();
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(140, now);
          osc.frequency.exponentialRampToValueAtTime(45, now + 0.25);

          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + 0.26);
        } catch (e) {}
      }
    };

    /* =========================================================
     * 3. 로컬 스토리지 & IndexedDB 이중 영구 보존 엔진
     * ========================================================= */
    function loadTasks() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw !== null) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) return parsed;
        }
      } catch (e) {
        console.warn('localStorage 접근 실패, 기본 데이터 로드:', e);
      }
      return defaultTasks;
    }

    function saveTasks() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      } catch (e) {
        console.error('localStorage 저장 실패:', e);
      }
      // IndexedDB에도 비동기 백업하여 확실히 보존
      saveToIndexedDB(tasks);
      renderTasks();
      updateRankAndStats();
    }

    // IndexedDB 비동기 백업 시스템 (GitHub Pages 안정성 보장)
    function initIndexedDBBackup() {
      if (!window.indexedDB) return;
      const req = window.indexedDB.open('KimetsuSlayerDB', 1);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('backup')) {
          db.createObjectStore('backup', { keyPath: 'id' });
        }
      };
      req.onsuccess = (e) => {
        const db = e.target.result;
        try {
          const tx = db.transaction('backup', 'readonly');
          const getReq = tx.objectStore('backup').get('tasks');
          getReq.onsuccess = () => {
            if (getReq.result && Array.isArray(getReq.result.data)) {
              // localStorage가 초기화되었거나 비어있을 경우 복구
              const raw = localStorage.getItem(STORAGE_KEY);
              if (!raw) {
                tasks = getReq.result.data;
                renderTasks();
                updateRankAndStats();
              }
            }
          };
        } catch (err) {}
      };
    }

    function saveToIndexedDB(tasksData) {
      if (!window.indexedDB) return;
      try {
        const req = window.indexedDB.open('KimetsuSlayerDB', 1);
        req.onsuccess = (e) => {
          const db = e.target.result;
          const tx = db.transaction('backup', 'readwrite');
          tx.objectStore('backup').put({ id: 'tasks', data: tasksData });
        };
      } catch (e) {}
    }

    /* =========================================================
     * 4. 귀살대 계급 및 진행도 계산
     * ========================================================= */
    function updateRankAndStats() {
      const total = tasks.length;
      const completed = tasks.filter(t => t.completed).length;
      const percent = total > 0 ? Math.round((completed / total) * 100) : 0;

      // 계급 판정 (완료한 임무 개수 기준)
      let currentRank = RANKS[0];
      for (let i = RANKS.length - 1; i >= 0; i--) {
        if (completed >= RANKS[i].min) {
          currentRank = RANKS[i];
          break;
        }
      }

      const rankTitleEl = document.getElementById('rankTitle');
      const rankBadgeEl = document.getElementById('rankBadge');
      const taskStatsEl = document.getElementById('taskStats');
      const progressBarEl = document.getElementById('progressBar');

      if (rankTitleEl) rankTitleEl.textContent = currentRank.title;
      if (taskStatsEl) taskStatsEl.textContent = `토벌 완료: ${completed} / 총 ${total}건 (${percent}%)`;
      if (progressBarEl) progressBarEl.style.width = `${percent}%`;

      // 뱃지 색상 클래스 적용
      if (rankBadgeEl) {
        rankBadgeEl.className = `px-3 py-1 rounded bg-stone-900 border ${currentRank.badge} ${currentRank.color} font-bold text-sm tracking-widest flex items-center gap-1 shadow transition-all duration-300`;
      }
    }

    /* =========================================================
     * 5. 테마 변경 시스템
     * ========================================================= */
    function changeTheme(themeName, showNotification = true) {
      currentTheme = themeName;
      try {
        localStorage.setItem(THEME_KEY, themeName);
      } catch (e) {}

      const banner = document.getElementById('themeBanner');
      if (!banner) return;

      banner.className = 'h-5 w-full rounded-t-lg shadow-md transition-all duration-500 ';
      if (themeName === 'tanjiro') {
        banner.classList.add('ichimatsu-pattern');
        if (showNotification) showToast('물의 호흡 · 탄지로 테마로 전환되었습니다.', '🌊');
      } else if (themeName === 'zenitsu') {
        banner.classList.add('zenitsu-pattern');
        if (showNotification) showToast('번개의 호흡 · 젠이츠 테마로 전환되었습니다.', '⚡');
      } else if (themeName === 'rengoku') {
        banner.classList.add('rengoku-pattern');
        if (showNotification) showToast('화염의 호흡 · 렌고쿠 테마! 마음을 불태워라!', '🔥');
      } else if (themeName === 'giyu') {
        banner.classList.add('giyu-pattern');
        if (showNotification) showToast('수주 토미오카 기유 테마로 전환되었습니다.', '🌊');
      }

      if (showNotification) AudioEngine.playSlash();
    }

    /* =========================================================
     * 6. 임무 렌더링 (Drag & Drop + 순서 변경 버튼)
     * ========================================================= */
    function renderTasks() {
      const listEl = document.getElementById('taskList');
      const emptyEl = document.getElementById('emptyState');
      if (!listEl) return;

      // 필터 적용
      const filteredTasks = tasks.map((task, originalIndex) => ({ ...task, originalIndex }))
        .filter(item => {
          if (currentFilter === 'active') return !item.completed;
          if (currentFilter === 'completed') return item.completed;
          return true;
        });

      if (filteredTasks.length === 0) {
        listEl.innerHTML = '';
        if (emptyEl) emptyEl.classList.remove('hidden');
        return;
      } else {
        if (emptyEl) emptyEl.classList.add('hidden');
      }

      listEl.innerHTML = filteredTasks.map((task, filteredIndex) => {
        const cat = CATEGORIES[task.category] || CATEGORIES.water;
        const isCompleted = task.completed;
        const idx = task.originalIndex;

        return `
          <li 
            data-index="${idx}"
            draggable="true"
            class="task-card group relative bg-stone-900/90 border ${isCompleted ? 'border-stone-800 bg-stone-950/60 opacity-75' : 'border-stone-800 hover:border-amber-700/60'} rounded-xl p-3.5 transition-all duration-200 shadow-md flex items-center justify-between gap-3 cursor-grab active:cursor-grabbing select-none"
          >
            <!-- 왼쪽: 순서 이동 버튼 & 드래그 손잡이 & 일륜도 코등이 체크 -->
            <div class="flex items-center gap-1.5 shrink-0">
              <!-- 모바일/접근성용 위/아래 이동 버튼 -->
              <div class="flex flex-col gap-0.5 opacity-60 group-hover:opacity-100 transition-opacity">
                <button 
                  onclick="moveTask(${idx}, -1); event.stopPropagation();" 
                  title="위로 이동" 
                  class="p-0.5 rounded hover:bg-stone-800 text-stone-400 hover:text-amber-400 disabled:opacity-20 cursor-pointer"
                  ${filteredIndex === 0 ? 'disabled' : ''}
                >
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 15l7-7 7 7"/></svg>
                </button>
                <button 
                  onclick="moveTask(${idx}, 1); event.stopPropagation();" 
                  title="아래로 이동" 
                  class="p-0.5 rounded hover:bg-stone-800 text-stone-400 hover:text-amber-400 disabled:opacity-20 cursor-pointer"
                  ${filteredIndex === filteredTasks.length - 1 ? 'disabled' : ''}
                >
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/></svg>
                </button>
              </div>

              <!-- 드래그 손잡이 아이콘 -->
              <div class="hidden sm:block text-stone-600 group-hover:text-amber-500/70 px-1 cursor-grab">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M8 6a2 2 0 100-4 2 2 0 000 4zm0 8a2 2 0 100-4 2 2 0 000 4zm0 8a2 2 0 100-4 2 2 0 000 4zm8-16a2 2 0 100-4 2 2 0 000 4zm0 8a2 2 0 100-4 2 2 0 000 4zm0 8a2 2 0 100-4 2 2 0 000 4z"/></svg>
              </div>

              <!-- 일륜도 코등이(칼 손잡이) 스타일 체크 버튼 -->
              <button 
                onclick="toggleTask(${idx}); event.stopPropagation();" 
                class="w-7 h-7 rounded-full border-2 flex items-center justify-center transition-all duration-300 cursor-pointer ${isCompleted ? 'bg-red-800/80 border-red-500 shadow-md shadow-red-950 scale-105' : 'border-stone-600 hover:border-amber-400 bg-stone-950'}"
                title="${isCompleted ? '토벌 완료됨 (클릭하여 취소)' : '임무 완수 (토벌)'}"
              >
                ${isCompleted ? `
                  <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
                ` : `
                  <span class="w-2 h-2 rounded-full bg-stone-700 group-hover:bg-amber-400 transition-colors"></span>
                `}
              </button>
            </div>

            <!-- 중앙: 임무 내용 및 뱃지 -->
            <div class="flex-grow min-w-0 px-2 cursor-pointer" onclick="toggleTask(${idx})">
              <div class="flex items-center gap-2 mb-1 flex-wrap">
                <span class="inline-flex items-center gap-1 text-[11px] px-2 py-0.5 rounded border ${cat.color} font-medium">
                  <span>${cat.icon}</span>
                  <span>${cat.label}</span>
                </span>
                ${isCompleted ? `
                  <span class="text-[10px] px-1.5 py-0.5 rounded bg-red-950/80 text-red-300 border border-red-700/60 font-bold">

                  </span>
                ` : ''}
              </div>
              <p class="text-sm md:text-base font-normal tracking-wide break-words transition-all duration-200 ${isCompleted ? 'line-through text-stone-500 slash-effect italic' : 'text-stone-100'}">

              </p>
            </div>

            <!-- 오른쪽: 삭제 버튼 -->
            <div class="shrink-0 flex items-center gap-1">
              <button 
                onclick="deleteTask(${idx}); event.stopPropagation();" 
                class="p-2 rounded-lg text-stone-500 hover:text-red-400 hover:bg-stone-800 transition-all active:scale-90 cursor-pointer"
                title="임무 파기 (삭제)"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>

    // HTML 특수문자 이스케이프
    function escapeHtml(str) {
      if (!str) return '';
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    /* =========================================================
     * 7. 할 일 추가 / 토글 / 이동 / 삭제 로직
     * ========================================================= */
    function addTask(text, category) {
      if (!text || text.trim() === '') return;
      const newTask = {
        id: Date.now(),
        text: text.trim(),
        category: category || 'water',
        completed: false,
        createdAt: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })
      };
      // 최상단에 새 임무 배치
      tasks.unshift(newTask);
      saveTasks();
      AudioEngine.playDrum();
      showToast('새로운 귀살대 임무가 하달되었습니다.', '📜');
    }

    function toggleTask(index) {
      if (tasks[index]) {
        tasks[index].completed = !tasks[index].completed;
        if (tasks[index].completed) {
          AudioEngine.playSlash();
          showToast('혈귀 토벌 완료! 임무를 완수했습니다.', '⚔️');
        } else {
          AudioEngine.playSheathe();
          showToast('임무를 다시 진행 상태로 되돌렸습니다.', '🔄');
        }
        saveTasks();
      }
    }

    // 위/아래 이동 (Up/Down)
    function moveTask(index, direction) {
      if (currentFilter !== 'all') {
        const filteredTasks = tasks.map((task, originalIndex) => ({ ...task, originalIndex }))
          .filter(item => {
            if (currentFilter === 'active') return !item.completed;
            if (currentFilter === 'completed') return item.completed;
            return true;
          });
        const currentPos = filteredTasks.findIndex(t => t.originalIndex === index);
        const targetPos = currentPos + direction;
        if (targetPos < 0 || targetPos >= filteredTasks.length) return;
        const targetIndex = filteredTasks[targetPos].originalIndex;

        const temp = tasks[index];
        tasks[index] = tasks[targetIndex];
        tasks[targetIndex] = temp;
      } else {
        const targetIndex = index + direction;
        if (targetIndex < 0 || targetIndex >= tasks.length) return;

        const temp = tasks[index];
        tasks[index] = tasks[targetIndex];
        tasks[targetIndex] = temp;
      }

      AudioEngine.playSheathe();
      saveTasks();
    }

    function deleteTask(index) {
      tasks.splice(index, 1);
      AudioEngine.playSlash();
      saveTasks();
      showToast('임무가 파기(삭제)되었습니다.', '🗑️');
    }

    function clearCompletedTasks() {
      const completedCount = tasks.filter(t => t.completed).length;
      if (completedCount === 0) {
        showToast('정리할 완료된 임무가 없습니다.', 'ℹ️');
        return;
      }
      tasks = tasks.filter(t => !t.completed);
      AudioEngine.playSlash();
      saveTasks();
      showToast(`${completedCount}개의 완료된 임무 두루마리를 정리했습니다.`, '✨');
    }

    function setFilter(filter) {
      currentFilter = filter;
      const tabs = {
        all: document.getElementById('filterAll'),
        active: document.getElementById('filterActive'),
        completed: document.getElementById('filterCompleted')
      };

      Object.keys(tabs).forEach(key => {
        if (!tabs[key]) return;
        if (key === filter) {
          tabs[key].className = 'px-3 py-1.5 rounded-md font-medium transition-colors bg-stone-800 text-amber-400 cursor-pointer';
        } else {
          tabs[key].className = 'px-3 py-1.5 rounded-md font-medium text-stone-400 hover:text-stone-200 transition-colors cursor-pointer';
        }
      });

      renderTasks();
    }

    /* =========================================================
     * 8. 드래그 앤 드롭 (HTML5 Drag & Drop API)
     * ========================================================= */
    function initDragAndDrop() {
      const listItems = document.querySelectorAll('#taskList > li');

      listItems.forEach(item => {
        item.addEventListener('dragstart', (e) => {
          draggedItemIndex = parseInt(item.getAttribute('data-index'));
          item.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });

        item.addEventListener('dragend', () => {
          item.classList.remove('dragging');
          listItems.forEach(el => el.classList.remove('drag-over'));
        });

        item.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          item.classList.add('drag-over');
        });

        item.addEventListener('dragleave', () => {
          item.classList.remove('drag-over');
        });

        item.addEventListener('drop', (e) => {
          e.preventDefault();
          item.classList.remove('drag-over');
          const targetIndex = parseInt(item.getAttribute('data-index'));

          if (draggedItemIndex !== null && draggedItemIndex !== targetIndex) {
            const draggedItem = tasks.splice(draggedItemIndex, 1)[0];
            tasks.splice(targetIndex, 0, draggedItem);
            AudioEngine.playSheathe();
            saveTasks();
            showToast('임무 순서를 재배치했습니다.', '📋');
          }
        });
      });
    }

    /* =========================================================
     * 9. 맞춤 알림 토스트 (alert 미사용 규정 준수)
     * ========================================================= */
    let toastTimeout = null;
    function showToast(message, icon = '⚔️') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      const toastIcon = document.getElementById('toastIcon');
      if (!toast || !toastMsg) return;

      toastMsg.textContent = message;
      if (toastIcon) toastIcon.textContent = icon;

      toast.classList.remove('translate-y-24', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.add('translate-y-24', 'opacity-0');
        toast.classList.remove('translate-y-0', 'opacity-100');
      }, 2600);
    }

    /* =========================================================
     * 10. 배경 애니메이션: 휘날리는 등꽃 꽃잎 & 불꽃 입자 캔버스
     * ========================================================= */
    function initCanvasAnimation() {
      const canvas = document.getElementById('petalCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const particles = [];
      const PARTICLE_COUNT = 38;

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          size: Math.random() * 5 + 3,
          speedX: Math.random() * 1.5 - 0.5,
          speedY: Math.random() * 1.2 + 0.6,
          rotation: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.04,
          opacity: Math.random() * 0.5 + 0.2,
          type: Math.random() > 0.4 ? 'wisteria' : 'ember'
        });
      }

      function draw() {
        ctx.clearRect(0, 0, width, height);

        particles.forEach(p => {
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rotation);

          if (p.type === 'wisteria') {
            ctx.fillStyle = `rgba(168, 85, 247, ${p.opacity})`;
            ctx.beginPath();
            ctx.ellipse(0, 0, p.size, p.size * 0.55, 0, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.fillStyle = `rgba(249, 115, 22, ${p.opacity * 0.85})`;
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#ea580c';
            ctx.beginPath();
            ctx.arc(0, 0, p.size * 0.4, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.restore();

          p.x += p.speedX;
          p.y += p.speedY;
          p.rotation += p.rotSpeed;

          if (p.y > height + 20) {
            p.y = -20;
            p.x = Math.random() * width;
          }
          if (p.x > width + 20) {
            p.x = -20;
          } else if (p.x < -20) {
            p.x = width + 20;
          }
        });

        requestAnimationFrame(draw);
      }

      draw();
    }

    /* =========================================================
     * 11. 이벤트 리스너 및 초기화
     * ========================================================= */
    window.addEventListener('DOMContentLoaded', () => {
      // 폼 제출 핸들러
      const form = document.getElementById('todoForm');
      const input = document.getElementById('taskInput');
      const categorySelect = document.getElementById('taskCategory');

      if (form && input) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const text = input.value.trim();
          if (text) {
            addTask(text, categorySelect.value);
            input.value = '';
            input.focus();
          }
        });
      }

      // 사운드 토글 버튼
      const soundBtn = document.getElementById('soundToggleBtn');
      const iconOn = document.getElementById('soundIconOn');
      const iconOff = document.getElementById('soundIconOff');
      const statusText = document.getElementById('soundStatusText');

      if (soundBtn) {
        soundBtn.addEventListener('click', () => {
          soundEnabled = !soundEnabled;
          try {
            localStorage.setItem(SOUND_KEY, String(soundEnabled));
          } catch (e) {}

          if (soundEnabled) {
            if (iconOn) iconOn.classList.remove('hidden');
            if (iconOff) iconOff.classList.add('hidden');
            if (statusText) statusText.textContent = '일륜도 검명음 ON';
            AudioEngine.playSlash();
            showToast('효과음이 켜졌습니다.', '🔊');
          } else {
            if (iconOn) iconOn.classList.add('hidden');
            if (iconOff) iconOff.classList.remove('hidden');
            if (statusText) statusText.textContent = '효과음 OFF';
            showToast('효과음이 꺼졌습니다.', '🔇');
          }
        });
      }

      // 음향 설정 복원
      try {
        const savedSound = localStorage.getItem(SOUND_KEY);
        if (savedSound !== null) {
          soundEnabled = savedSound === 'true';
          if (!soundEnabled) {
            if (iconOn) iconOn.classList.add('hidden');
            if (iconOff) iconOff.classList.remove('hidden');
            if (statusText) statusText.textContent = '효과음 OFF';
          }
        }
      } catch (e) {}

      // 테마 복원 (초기 로딩 시에는 무음/토스트 없이 적용)
      try {
        const savedTheme = localStorage.getItem(THEME_KEY);
        if (savedTheme) {
          changeTheme(savedTheme, false);
        }
      } catch (e) {}

      // IndexedDB 보존 엔진 활성화
      initIndexedDBBackup();

      // 초기 렌더링
      renderTasks();
      updateRankAndStats();
      initCanvasAnimation();
    });
  </script>
</body>
</html>
