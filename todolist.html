<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>귀살대 임무 일지 | Demon Slayer To-Do</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Yuji+Syuku&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Noto Serif KR"', 'serif'],
            calli: ['"Yuji Syuku"', '"Noto Serif KR"', 'serif'],
          },
          colors: {
            nichirin: {
              red: '#e11d48',
              crimson: '#991b1b',
              water: '#0ea5e9',
              thunder: '#eab308',
              flame: '#ea580c',
              beast: '#059669',
              wisteria: '#a855f7',
              dark: '#0f172a'
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #0b0c10;
      color: #e5e5e5;
      overflow-x: hidden;
    }

    /* 먹물 & 혈광 그림자 */
    .ink-shadow {
      text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.9), 0 0 12px rgba(225, 29, 72, 0.4);
    }
    
    .kisatsu-border {
      border: 2px solid #27272a;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7), inset 0 0 15px rgba(0, 0, 0, 0.6);
    }

    /* 하오리(羽織) 패턴 */
    /* 1. 탄지로 (이치마츠 바둑판) */
    .haori-tanjiro {
      background-color: #052e16;
      background-image: 
        linear-gradient(45deg, #111 25%, transparent 25%), 
        linear-gradient(-45deg, #111 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #111 75%), 
        linear-gradient(-45deg, transparent 75%, #111 75%);
      background-size: 24px 24px;
      background-position: 0 0, 0 12px, 12px -12px, -12px 0px;
    }

    /* 2. 젠이츠 (삼각 벼락) */
    .haori-zenitsu {
      background: linear-gradient(135deg, #ca8a04 0%, #ea580c 100%);
      background-image: radial-gradient(#fff 15%, transparent 16%), radial-gradient(#fff 15%, transparent 16%);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
    }

    /* 3. 렌고쿠 (화염) */
    .haori-rengoku {
      background: linear-gradient(180deg, #fef08a 0%, #ea580c 50%, #991b1b 100%);
    }

    /* 4. 기유 (반반 하오리) */
    .haori-giyu {
      background: linear-gradient(90deg, #831843 50%, #1e3a8a 50%);
    }

    /* 일륜도 베기 애니메이션 */
    @keyframes nichirinSlash {
      0% { transform: scaleX(0) rotate(-1.5deg); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: scaleX(1.12) rotate(-1.5deg); opacity: 0.85; }
    }

    .slash-effect {
      position: relative;
    }

    .slash-effect::after {
      content: '';
      position: absolute;
      top: 50%;
      left: -6%;
      width: 112%;
      height: 4px;
      background: linear-gradient(90deg, transparent, #38bdf8, #e11d48, #ffffff, #e11d48, transparent);
      box-shadow: 0 0 14px #38bdf8, 0 0 8px #f43f5e;
      transform-origin: left center;
      animation: nichirinSlash 0.28s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
      pointer-events: none;
      z-index: 10;
    }

    .task-completed {
      opacity: 0.65;
      filter: grayscale(0.35);
      transition: all 0.3s ease;
    }

    /* 드래그 앤 드롭 효과 */
    .draggable { cursor: grab; }
    .draggable:active { cursor: grabbing; }
    .drag-over {
      border-top: 2px dashed #38bdf8 !important;
      opacity: 0.7;
    }

    /* 등꽃 배경 캔버스 */
    #wisteriaCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: -1;
    }

    /* 스크롤바 */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0b0c10; }
    ::-webkit-scrollbar-thumb { background: #4c1d95; border-radius: 4px; }
  </style>
</head>
<body class="font-serif min-h-screen relative flex flex-col items-center py-10 px-4">

  <!-- 등꽃 & 불티 흩날리는 배경 캔버스 -->
  <canvas id="wisteriaCanvas"></canvas>

  <div class="w-full max-w-2xl z-10 relative">

    <!-- 귀살대 '멸(滅)' 인장 워터마크 -->
    <div class="absolute top-28 left-1/2 -translate-x-1/2 font-calli text-[180px] md:text-[220px] font-black text-white/[0.03] select-none pointer-events-none -z-10">
      滅
    </div>

    <!-- 헤더 영역 -->
    <header class="text-center mb-8 bg-zinc-950/80 p-6 rounded-2xl kisatsu-border backdrop-blur-md relative overflow-hidden">
      
      <!-- 상단 하오리 리본 장식 (테마에 따라 변함) -->
      <div id="haoriRibbon" class="haori-tanjiro h-3.5 w-full absolute top-0 left-0 transition-all duration-500 shadow-md"></div>

      <!-- 음향 토글 / 하오리 변경 / 계급 배지 바 -->
      <div class="flex flex-wrap justify-between items-center gap-3 mb-5 mt-2 relative z-10">
        <div class="flex items-center gap-2">
          <button onclick="toggleSound()" class="flex items-center gap-1.5 bg-zinc-900 border border-zinc-700 hover:border-sky-500 px-3 py-1.5 rounded-full text-xs text-zinc-300 transition-all cursor-pointer">
            <span>일륜도 음향:</span>
            <span id="soundStatus" class="text-sky-400 font-bold">ON</span>
          </button>
          
          <!-- 하오리 테마 선택기 -->
          <div class="flex items-center gap-1 bg-zinc-900 p-1 rounded-full border border-zinc-800">
            <button onclick="setHaoriTheme('tanjiro')" class="w-5 h-5 rounded-full haori-tanjiro border border-white/40 hover:scale-110 transition-transform" title="탄지로 (물/해)"></button>
            <button onclick="setHaoriTheme('zenitsu')" class="w-5 h-5 rounded-full haori-zenitsu border border-white/40 hover:scale-110 transition-transform" title="젠이츠 (번개)"></button>
            <button onclick="setHaoriTheme('rengoku')" class="w-5 h-5 rounded-full haori-rengoku border border-white/40 hover:scale-110 transition-transform" title="렌고쿠 (화염)"></button>
            <button onclick="setHaoriTheme('giyu')" class="w-5 h-5 rounded-full haori-giyu border border-white/40 hover:scale-110 transition-transform" title="기유 (물)"></button>
          </div>
        </div>

        <!-- 귀살대 현재 계급 배지 -->
        <div class="flex items-center gap-2 bg-gradient-to-r from-zinc-900 to-zinc-950 border border-red-900/60 px-4 py-1.5 rounded-full text-xs shadow-[0_0_12px_rgba(225,29,72,0.25)]">
          <span class="text-zinc-400">귀살대 계급:</span>
          <span id="rankBadge" class="font-calli text-red-500 font-black text-base px-1">癸</span>
          <span id="rankTitle" class="text-zinc-200 font-bold text-xs tracking-wider">(계 - 견습)</span>
        </div>
      </div>

      <!-- 수련패 고유 상태 표시 -->
      <div class="text-[11px] text-zinc-500 font-mono mb-2 text-right">
        대원 식별패: <span id="userBadge" class="text-zinc-400">귀살대 본부 연결 중...</span>
      </div>

      <!-- 메인 타이틀 -->
      <div class="flex items-center justify-center gap-3 mb-1 relative z-10">
        <span class="text-red-500 text-2xl font-calli">⚔</span>
        <h1 class="text-3xl md:text-5xl font-black text-white ink-shadow tracking-widest font-calli">
          鬼殺隊 任務日誌
        </h1>
        <span class="text-red-500 text-2xl font-calli">⚔</span>
      </div>
      <p class="text-zinc-400 text-xs md:text-sm mt-1 relative z-10">전집중·상중(全集中·常中)으로 오늘의 지령을 완수하라</p>

      <!-- 캐릭터 명대사 카드 -->
      <div class="mt-6 mx-auto max-w-lg p-4 rounded-xl bg-zinc-900/90 border border-zinc-800 flex items-center gap-4 relative overflow-hidden">
        <div class="w-16 h-16 rounded-full bg-zinc-950 border-2 border-red-600 flex items-center justify-center flex-shrink-0 shadow-[0_0_10px_rgba(225,29,72,0.4)]">
          <span class="font-calli text-2xl font-bold text-red-500">滅</span>
        </div>
        <div class="text-left flex-1">
          <p class="text-red-400 text-[11px] font-bold tracking-widest uppercase">Kamado Tanjiro</p>
          <p class="text-zinc-200 text-sm font-semibold italic mt-0.5">
            "포기하지 마! 도망치지 마! 마음을 불태워라!"
          </p>
        </div>
      </div>

      <!-- 계급 진척도 (임무 완수 게이지) -->
      <div class="mt-5 w-full bg-zinc-900 rounded-full h-3 border border-zinc-800 relative overflow-hidden z-10">
        <div id="rankProgressBar" class="bg-gradient-to-r from-red-950 via-red-600 to-sky-400 h-3 rounded-full transition-all duration-700 w-0 shadow-[0_0_10px_#e11d48]"></div>
      </div>
      <div class="flex justify-between items-center text-xs text-zinc-400 mt-2 px-1">
        <span id="rankCountText">격파한 혈귀(완수 임무): 0건</span>
        <span id="rankNextText">다음 승급(壬): 2건</span>
      </div>
    </header>

    <!-- 임무 하달 (입력 영역) -->
    <div class="bg-zinc-950/80 p-3 rounded-xl border border-zinc-800 mb-6 shadow-xl backdrop-blur-sm">
      <div class="flex flex-col sm:flex-row gap-2">
        <!-- 호흡 계열 선택 -->
        <select id="breathSelect" class="bg-zinc-900 text-zinc-200 text-xs px-3 py-3 rounded-lg border border-zinc-700 focus:outline-none focus:border-red-500 font-bold">
          <option value="water">물의 호흡 (水)</option>
          <option value="thunder">번개의 호흡 (雷)</option>
          <option value="flame">화염의 호흡 (炎)</option>
          <option value="beast">짐승의 호흡 (獸)</option>
          <option value="sun">해의 호흡 (日)</option>
        </select>

        <input type="text" id="taskInput" 
          class="flex-1 bg-zinc-900 border border-zinc-700 text-white px-4 py-3 rounded-lg focus:outline-none focus:border-red-500 transition-all font-medium placeholder-zinc-500 text-sm" 
          placeholder="까마귀가 전달한 새로운 임무를 입력하십시오..."
          onkeypress="handleKeyPress(event)">

        <button onclick="addTask()" 
          class="bg-gradient-to-r from-red-700 to-red-900 hover:from-red-600 hover:to-red-800 text-white px-6 py-3 rounded-lg font-bold border border-red-800 transition-all shadow-[0_0_15px_rgba(225,29,72,0.3)] whitespace-nowrap text-sm flex items-center justify-center gap-2 cursor-pointer">
          <span>임무 수령</span>
          <span class="font-calli">斬</span>
        </button>
      </div>
    </div>

    <!-- 임무 목록 -->
    <ul id="taskList" class="space-y-3">
      <!-- 동적으로 렌더링 -->
    </ul>
    
    <!-- 비었을 때 화면 -->
    <div id="emptyMessage" class="text-center py-14 text-zinc-500 hidden">
      <div class="text-4xl mb-2 font-calli text-zinc-600">無</div>
      <p class="text-base font-bold text-zinc-400">현재 하달된 임무가 없습니다.</p>
      <p class="text-xs mt-1 text-zinc-600">수련을 게을리하지 말고 다음 지령을 기다리십시오.</p>
    </div>

    <!-- 푸터 -->
    <footer class="mt-12 text-center text-xs text-zinc-600">
      <p>귀살대 본부 공인 · 전집중 임무 일지 시스템</p>
    </footer>

  </div>

  <!-- 데이터 영구 보존 및 클라우드 연동 모듈 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, updateDoc, deleteDoc, onSnapshot, collection, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // --- 앱 상태 ---
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'kimetsu-todo';
    let db = null;
    let auth = null;
    let user = null;
    let userId = null;

    // 귀살대 기본 임무 샘플
    let tasks = [
      { id: 'k1', text: '물의 호흡(水の呼吸) 제1형 수면베기 500회 수련', completed: false, breath: 'water', order: 0 },
      { id: 'k2', text: '일륜도(日輪刀) 날 손질 및 숫돌 연마', completed: false, breath: 'sun', order: 1 },
      { id: 'k3', text: '네즈코 나무 궤짝 메고 사기리산 왕복 달리기', completed: false, breath: 'beast', order: 2 },
      { id: 'k4', text: '카스가이 까마귀의 야간 토벌 지령 확인', completed: false, breath: 'flame', order: 3 }
    ];
    let completedTotalCount = 0;
    let soundEnabled = true;
    let currentTheme = 'tanjiro';

    // 귀살대 10계급 + 柱(주) 시스템
    const ranks = [
      { kanji: '癸', title: '계 (견습 대원)', req: 0 },
      { kanji: '壬', title: '임 (신참 검사)', req: 2 },
      { kanji: '辛', title: '신 (정규 대원)', req: 5 },
      { kanji: '庚', title: '경 (숙련 검사)', req: 9 },
      { kanji: '己', title: '기 (정예 대원)', req: 14 },
      { kanji: '戊', title: '무 (소대장)', req: 20 },
      { kanji: '丁', title: '정 (수석 검사)', req: 28 },
      { kanji: '丙', title: '병 (상급 무사)', req: 38 },
      { kanji: '乙', title: '을 (지휘관)', req: 50 },
      { kanji: '甲', title: '갑 (차기 지주)', req: 65 },
      { kanji: '柱', title: '주 (귀살대 지주 - Hashira)', req: 85 }
    ];

    const breathStyles = {
      water: { label: '水', color: 'border-sky-500/50 text-sky-400 bg-sky-950/40' },
      thunder: { label: '雷', color: 'border-yellow-500/50 text-yellow-400 bg-yellow-950/40' },
      flame: { label: '炎', color: 'border-orange-500/50 text-orange-400 bg-orange-950/40' },
      beast: { label: '獸', color: 'border-emerald-500/50 text-emerald-400 bg-emerald-950/40' },
      sun: { label: '日', color: 'border-red-500/50 text-red-400 bg-red-950/40' }
    };

    // --- Web Audio API (일륜도 검격 효과음 합성) ---
    let audioCtx = null;

    function playSlashSound() {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        // 고주파에서 저주파로 빠르게 떨어지는 톱니파 (칼날 베는 쇳소리)
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(1600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.18);

        gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0.35, audioCtx.currentTime + 0.02);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.22);

        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.22);
      } catch (e) {
        console.warn("오디오 재생 실패:", e);
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const statusSpan = document.getElementById('soundStatus');
      if (statusSpan) {
        if (soundEnabled) {
          statusSpan.innerText = 'ON';
          statusSpan.className = 'text-sky-400 font-bold';
        } else {
          statusSpan.innerText = 'OFF';
          statusSpan.className = 'text-zinc-500 font-bold';
        }
      }
    }

    function setHaoriTheme(theme) {
      currentTheme = theme;
      const ribbon = document.getElementById('haoriRibbon');
      if (ribbon) {
        ribbon.className = `haori-${theme} h-3.5 w-full absolute top-0 left-0 transition-all duration-500 shadow-md`;
      }
      saveLocalProfile();
    }

    // --- 브라우저 영구 보존 엔진 (IndexedDB) ---
    const DB_NAME = 'KimetsuTodoDB';
    const DB_VERSION = 1;
    let localDB = null;

    function initLocalDatabase() {
      return new Promise((resolve) => {
        if (!window.indexedDB) {
          resolve(null);
          return;
        }
        const req = window.indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const dbInstance = e.target.result;
          if (!dbInstance.objectStoreNames.contains('tasks')) {
            dbInstance.createObjectStore('tasks', { keyPath: 'id' });
          }
          if (!dbInstance.objectStoreNames.contains('profile')) {
            dbInstance.createObjectStore('profile', { keyPath: 'key' });
          }
        };
        req.onsuccess = (e) => {
          localDB = e.target.result;
          resolve(localDB);
        };
        req.onerror = () => resolve(null);
      });
    }

    function loadFromLocalDatabase() {
      return new Promise((resolve) => {
        if (!localDB) {
          resolve(false);
          return;
        }
        try {
          const tx = localDB.transaction(['tasks', 'profile'], 'readonly');
          const taskStore = tx.objectStore('tasks');
          const profileStore = tx.objectStore('profile');

          const tasksReq = taskStore.getAll();
          const statsReq = profileStore.get('stats');
          const themeReq = profileStore.get('theme');

          tx.oncomplete = () => {
            let hasData = false;
            if (tasksReq.result && tasksReq.result.length > 0) {
              tasks = tasksReq.result;
              tasks.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
              hasData = true;
            }
            if (statsReq.result && typeof statsReq.result.val === 'number') {
              completedTotalCount = statsReq.result.val;
            }
            if (themeReq.result && themeReq.result.val) {
              setHaoriTheme(themeReq.result.val);
            }
            resolve(hasData);
          };
          tx.onerror = () => resolve(false);
        } catch (e) {
          resolve(false);
        }
      });
    }

    function saveLocalTask(task) {
      if (!localDB) return;
      try {
        const tx = localDB.transaction('tasks', 'readwrite');
        tx.objectStore('tasks').put(task);
      } catch (e) {}
    }

    function deleteLocalTask(id) {
      if (!localDB) return;
      try {
        const tx = localDB.transaction('tasks', 'readwrite');
        tx.objectStore('tasks').delete(id);
      } catch (e) {}
    }

    function saveAllLocalTasks() {
      if (!localDB) return;
      try {
        const tx = localDB.transaction('tasks', 'readwrite');
        const store = tx.objectStore('tasks');
        store.clear();
        tasks.forEach(t => store.put(t));
      } catch (e) {}
    }

    function saveLocalProfile() {
      if (!localDB) return;
      try {
        const tx = localDB.transaction('profile', 'readwrite');
        const store = tx.objectStore('profile');
        store.put({ key: 'stats', val: completedTotalCount });
        store.put({ key: 'theme', val: currentTheme });
      } catch (e) {}
    }

    // --- 스토리지 & 클라우드 초기화 ---
    async function initStorage() {
      const userBadge = document.getElementById('userBadge');

      // 1. 브라우저 영구 보존 엔진 초기화 및 복원
      await initLocalDatabase();
      const hasSavedData = await loadFromLocalDatabase();

      if (!hasSavedData) {
        saveAllLocalTasks();
        saveLocalProfile();
      }

      renderTasks();
      updateEmptyMessage();
      updateRank();

      // 2. 외부 배포(GitHub Pages 등) 안내 배지 설정
      if (typeof __firebase_config === 'undefined') {
        if (userBadge) userBadge.innerText = '귀살대 막사 (브라우저 영구 보존 중)';
        return;
      }

      // 3. 클라우드 연동 가능 환경인 경우 실시간 Firestore 동기화
      try {
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);

        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }

        user = auth.currentUser;
        userId = user ? user.uid : crypto.randomUUID();
        if (userBadge) userBadge.innerText = userId;

        const tasksCol = collection(db, 'artifacts', appId, 'users', userId, 'tasks');
        const tasksQuery = query(tasksCol);

        onSnapshot(tasksQuery, async (snapshot) => {
          if (snapshot.empty) {
            for (let i = 0; i < tasks.length; i++) {
              const item = tasks[i];
              const docRef = doc(db, 'artifacts', appId, 'users', userId, 'tasks', item.id);
              await setDoc(docRef, item);
            }
          } else {
            const fetched = [];
            snapshot.forEach((snap) => fetched.push(snap.data()));
            fetched.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
            tasks = fetched;
            saveAllLocalTasks();
            renderTasks();
            updateEmptyMessage();
          }
        }, (err) => console.error("클라우드 임무 동기화 실패:", err));

        const statsDocRef = doc(db, 'artifacts', appId, 'users', userId, 'profile', 'stats');
        onSnapshot(statsDocRef, (snap) => {
          if (snap.exists()) {
            const data = snap.data();
            if (typeof data.completedTotalCount === 'number') {
              completedTotalCount = data.completedTotalCount;
              saveLocalProfile();
              updateRank();
            }
          }
        }, (err) => console.error("클라우드 계급 동기화 실패:", err));

      } catch (err) {
        console.warn("로컬 영구 모드로 동작:", err);
        if (userBadge) userBadge.innerText = '귀살대 막사 (브라우저 영구 보존 중)';
      }
    }

    // --- 임무 조작 로직 ---
    function handleKeyPress(e) {
      if (e.key === 'Enter') addTask();
    }

    function generateId() {
      return 'k_' + Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
    }

    async function addTask() {
      const input = document.getElementById('taskInput');
      const text = input.value.trim();
      const breath = document.getElementById('breathSelect')?.value || 'water';
      if (!text) return;

      const newTask = {
        id: generateId(),
        text: text,
        completed: false,
        breath: breath,
        order: tasks.length > 0 ? Math.min(...tasks.map(t => t.order ?? 0)) - 1 : 0
      };

      tasks.unshift(newTask);
      input.value = '';
      renderTasks();
      updateEmptyMessage();

      // 브라우저 보존
      saveLocalTask(newTask);

      // 클라우드 저장
      if (user && db) {
        try {
          const docRef = doc(db, 'artifacts', appId, 'users', userId, 'tasks', newTask.id);
          await setDoc(docRef, newTask);
        } catch (e) {
          console.error("클라우드 저장 실패:", e);
        }
      }
    }

    async function toggleTask(id) {
      const index = tasks.findIndex(t => t.id === id);
      if (index === -1) return;

      const task = tasks[index];
      const isCompleting = !task.completed;
      task.completed = isCompleting;

      const li = document.getElementById(`task-${id}`);
      if (li) {
        if (isCompleting) {
          playSlashSound();
          completedTotalCount++;
          updateRank();
          const textSpan = li.querySelector('.task-text');
          if (textSpan) textSpan.classList.add('slash-effect');
          li.classList.add('task-completed');
        } else {
          const textSpan = li.querySelector('.task-text');
          if (textSpan) textSpan.classList.remove('slash-effect');
          li.classList.remove('task-completed');
          completedTotalCount = Math.max(0, completedTotalCount - 1);
          updateRank();
        }

        const checkbox = li.querySelector('.custom-tsuba');
        if (checkbox) {
          checkbox.innerHTML = isCompleting ? '<span class="font-calli text-red-500 font-bold">滅</span>' : '';
        }
      }

      // 브라우저 보존
      saveLocalTask(task);
      saveLocalProfile();

      // 클라우드 저장
      if (user && db) {
        try {
          const docRef = doc(db, 'artifacts', appId, 'users', userId, 'tasks', id);
          await updateDoc(docRef, { completed: task.completed });

          const statsRef = doc(db, 'artifacts', appId, 'users', userId, 'profile', 'stats');
          await setDoc(statsRef, { completedTotalCount }, { merge: true });
        } catch (e) {
          console.error("클라우드 토글 갱신 실패:", e);
        }
      }
    }

    async function deleteTask(id) {
      const li = document.getElementById(`task-${id}`);
      if (li) {
        li.style.transform = 'scale(0.92)';
        li.style.opacity = '0';
      }

      setTimeout(async () => {
        tasks = tasks.filter(t => t.id !== id);
        renderTasks();
        updateEmptyMessage();

        // 브라우저 삭제
        deleteLocalTask(id);

        // 클라우드 삭제
        if (user && db) {
          try {
            const docRef = doc(db, 'artifacts', appId, 'users', userId, 'tasks', id);
            await deleteDoc(docRef);
          } catch (e) {
            console.error("클라우드 삭제 실패:", e);
          }
        }
      }, 180);
    }

    async function syncOrders() {
      saveAllLocalTasks();
      if (!user || !db) return;
      try {
        for (let i = 0; i < tasks.length; i++) {
          tasks[i].order = i;
          const docRef = doc(db, 'artifacts', appId, 'users', userId, 'tasks', tasks[i].id);
          await updateDoc(docRef, { order: i });
        }
      } catch (e) {
        console.error("순서 동기화 실패:", e);
      }
    }

    function moveTask(index, direction) {
      if (direction === -1 && index > 0) {
        [tasks[index - 1], tasks[index]] = [tasks[index], tasks[index - 1]];
      } else if (direction === 1 && index < tasks.length - 1) {
        [tasks[index + 1], tasks[index]] = [tasks[index], tasks[index + 1]];
      }
      renderTasks();
      syncOrders();
    }

    // --- 드래그 앤 드롭 ---
    let draggedIndex = null;

    function handleDragStart(e, index) {
      draggedIndex = index;
      e.dataTransfer.effectAllowed = 'move';
      setTimeout(() => e.target.style.opacity = '0.5', 0);
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.currentTarget.classList.add('drag-over');
    }

    function handleDragLeave(e) {
      e.currentTarget.classList.remove('drag-over');
    }

    function handleDrop(e, index) {
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over');
      if (draggedIndex !== null && draggedIndex !== index) {
        const itemToMove = tasks.splice(draggedIndex, 1)[0];
        tasks.splice(index, 0, itemToMove);
        renderTasks();
        syncOrders();
      }
      draggedIndex = null;
    }

    function handleDragEnd(e) {
      e.target.style.opacity = '1';
      document.querySelectorAll('li').forEach(el => el.classList.remove('drag-over'));
    }

    // --- 계급 계산 ---
    function updateRank() {
      let currentRank = ranks[0];
      let nextRank = ranks[1];
      let rankIndex = 0;

      for (let i = 0; i < ranks.length; i++) {
        if (completedTotalCount >= ranks[i].req) {
          currentRank = ranks[i];
          rankIndex = i;
          nextRank = ranks[i + 1] || null;
        } else {
          break;
        }
      }

      const rankBadge = document.getElementById('rankBadge');
      const rankTitle = document.getElementById('rankTitle');
      const rankCountText = document.getElementById('rankCountText');
      const rankNextText = document.getElementById('rankNextText');
      const progressBar = document.getElementById('rankProgressBar');

      if (rankBadge) rankBadge.innerText = currentRank.kanji;
      if (rankTitle) rankTitle.innerText = `(${currentRank.title})`;
      if (rankCountText) rankCountText.innerText = `토벌한 혈귀: ${completedTotalCount}건`;

      if (progressBar && rankNextText) {
        if (nextRank) {
          const prevReq = ranks[rankIndex].req;
          const nextReq = nextRank.req;
          const currentProgress = completedTotalCount - prevReq;
          const required = nextReq - prevReq;
          const percent = Math.min(100, Math.max(0, (currentProgress / required) * 100));
          progressBar.style.width = `${percent}%`;
          rankNextText.innerText = `다음 계급(${nextRank.kanji}): ${nextRank.req}건`;
        } else {
          progressBar.style.width = '100%';
          rankNextText.innerText = `귀살대 최고위(柱)의 경지에 도달하였습니다.`;
        }
      }
    }

    // --- 렌더링 ---
    function renderTasks() {
      const list = document.getElementById('taskList');
      if (!list) return;
      list.innerHTML = '';

      tasks.forEach((task, index) => {
        const li = document.createElement('li');
        li.id = `task-${task.id}`;
        li.className = `draggable flex items-center gap-3 p-3.5 bg-zinc-950/80 border border-zinc-800 rounded-xl transition-all ${task.completed ? 'task-completed' : 'hover:border-zinc-700'}`;
        li.draggable = true;

        li.addEventListener('dragstart', (e) => handleDragStart(e, index));
        li.addEventListener('dragover', handleDragOver);
        li.addEventListener('dragleave', handleDragLeave);
        li.addEventListener('drop', (e) => handleDrop(e, index));
        li.addEventListener('dragend', handleDragEnd);

        const style = breathStyles[task.breath] || breathStyles.water;

        li.innerHTML = `
          <!-- 코등이(Tsuba) 형태의 체크박스 -->
          <button onclick="toggleTask('${task.id}')" 
            class="custom-tsuba w-7 h-7 flex-shrink-0 flex items-center justify-center rounded-lg border-2 border-zinc-700 bg-zinc-900 transition-colors shadow-inner" title="임무 완수 (일륜도 검격)">
            ${task.completed ? '<span class="font-calli text-red-500 font-bold">滅</span>' : ''}
          </button>

          <!-- 호흡 마크 -->
          <span class="text-xs px-2 py-0.5 rounded border font-calli ${style.color}">
            ${style.label}
          </span>

          <!-- 내용 -->
          <div class="flex-1 overflow-hidden cursor-pointer" onclick="toggleTask('${task.id}')">
            <span class="task-text text-sm md:text-base inline-block break-all ${task.completed ? 'slash-effect' : 'text-zinc-200'}">
              ${escapeHtml(task.text)}
            </span>
          </div>

          <!-- 조작 버튼 -->
          <div class="flex items-center gap-1.5 opacity-70 hover:opacity-100 transition-opacity">
            <div class="flex flex-col gap-0.5">
              <button onclick="moveTask(${index}, -1)" class="px-1.5 py-0.5 text-zinc-500 hover:text-white bg-zinc-900 border border-zinc-800 rounded text-[10px]" title="위로" ${index === 0 ? 'disabled class="opacity-20"' : ''}>▲</button>
              <button onclick="moveTask(${index}, 1)" class="px-1.5 py-0.5 text-zinc-500 hover:text-white bg-zinc-900 border border-zinc-800 rounded text-[10px]" title="아래로" ${index === tasks.length - 1 ? 'disabled class="opacity-20"' : ''}>▼</button>
            </div>
            <button onclick="deleteTask('${task.id}')" class="px-2.5 py-1.5 bg-red-950/40 text-red-400 border border-red-900/40 rounded-lg hover:bg-red-900 hover:text-white transition-colors text-xs font-bold font-calli">
              除
            </button>
          </div>
        `;
        list.appendChild(li);
      });
    }

    function updateEmptyMessage() {
      const msg = document.getElementById('emptyMessage');
      if (!msg) return;
      if (tasks.length === 0) msg.classList.remove('hidden');
      else msg.classList.add('hidden');
    }

    function escapeHtml(unsafe) {
      return unsafe
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // --- 캔버스: 등꽃 꽃잎 & 불티 파티클 ---
    const canvas = document.getElementById('wisteriaCanvas');
    const ctx = canvas ? canvas.getContext('2d') : null;
    let particles = [];
    const particleCount = 45;

    function resizeCanvas() {
      if (!canvas) return;
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    class WisteriaPetal {
      constructor() {
        this.reset();
        this.y = Math.random() * (canvas ? canvas.height : 600);
      }

      reset() {
        this.x = Math.random() * (canvas ? canvas.width : 600);
        this.y = -20;
        this.size = Math.random() * 4 + 2;
        this.speedY = Math.random() * 1.2 + 0.6;
        this.speedX = (Math.random() - 0.5) * 0.8;
        this.rotation = Math.random() * 360;
        this.rotationSpeed = (Math.random() - 0.5) * 2;
        this.opacity = Math.random() * 0.5 + 0.2;
        // 보라색 등꽃 또는 붉은 불꽃 입자 랜덤
        this.isEmber = Math.random() > 0.7;
      }

      update() {
        this.y += this.speedY;
        this.x += Math.sin(this.y * 0.015) + this.speedX;
        this.rotation += this.rotationSpeed;

        if (canvas && (this.y > canvas.height + 20 || this.x < -20 || this.x > canvas.width + 20)) {
          this.reset();
        }
      }

      draw() {
        if (!ctx) return;
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate((this.rotation * Math.PI) / 180);
        ctx.globalAlpha = this.opacity;

        ctx.beginPath();
        if (this.isEmber) {
          ctx.arc(0, 0, this.size * 0.6, 0, Math.PI * 2);
          ctx.fillStyle = '#f97316';
          ctx.shadowBlur = 6;
          ctx.shadowColor = '#ea580c';
        } else {
          ctx.ellipse(0, 0, this.size, this.size / 2.2, 0, 0, Math.PI * 2);
          ctx.fillStyle = '#c084fc';
        }
        ctx.fill();
        ctx.restore();
      }
    }

    function initCanvas() {
      if (!canvas) return;
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
      for (let i = 0; i < particleCount; i++) {
        particles.push(new WisteriaPetal());
      }
      animateCanvas();
    }

    function animateCanvas() {
      if (!ctx || !canvas) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateCanvas);
    }

    // 전역 함수 연결
    window.addTask = addTask;
    window.toggleTask = toggleTask;
    window.deleteTask = deleteTask;
    window.moveTask = moveTask;
    window.toggleSound = toggleSound;
    window.setHaoriTheme = setHaoriTheme;
    window.handleKeyPress = handleKeyPress;

    window.addEventListener('DOMContentLoaded', () => {
      initCanvas();
      initStorage();
    });
  </script>
</body>
</html>
